services:
  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements.prod.txt
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8006:8000"
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./deploy-data/staticfiles:/app/staticfiles
      - ./deploy-data/media:/app/media
    restart: unless-stopped

  db:
    image: postgres:16
    env_file:
      - .env.prod
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U usr_walo -d db_walo" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
