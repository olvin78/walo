<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#FFFFFF" rx="112" />
  
  <g transform="translate(256, 180) rotate(45)">
    <!-- Borde de la etiqueta (Fondo blanco, borde verde) -->
    <path d="M 0 -110 L 80 -30 L 80 110 L -80 110 L -80 -30 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="18" stroke-linejoin="round" />
    
    <!-- Agujero de la etiqueta -->
    <circle cx="0" cy="-60" r="12" fill="#FFFFFF" stroke="#10B981" stroke-width="14" />
    
    <!-- Signo de Igual central -->
    <path d="M -40 10 L 40 10" fill="none" stroke="#10B981" stroke-width="22" stroke-linecap="round" />
    <path d="M -40 55 L 40 55" fill="none" stroke="#0EA5E9" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- Tipografía en tonos frescos -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#059669" text-anchor="middle" letter-spacing="4">IGUALO</text>
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#0EA5E9" text-anchor="middle" letter-spacing="10">MARKETPLACE</text>
</svg>
