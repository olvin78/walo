<!-- 🛡️ Popup Verificación IGUALO (mismo estilo que Navidad) -->
<style>
    .xmas-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(6px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        padding: 20px;
    }
    .xmas-overlay.is-active { display: flex; }

    .xmas-card {
        background: linear-gradient(160deg, #0d1a2e 0%, #121726 55%, #16213c 100%);
        border: 1px solid rgba(56, 132, 255, 0.4);
        border-radius: 24px;
        max-width: 440px;
        width: 100%;
        padding: 40px 30px 34px;
        text-align: center;
        position: relative;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(56, 132, 255, 0.18);
        animation: xmasPop 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes xmasPop {
        from { opacity: 0; transform: scale(0.85) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .xmas-close {
        position: absolute;
        top: 14px;
        right: 16px;
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.45);
        font-size: 1.6rem;
        cursor: pointer;
        line-height: 1;
        transition: color 0.2s;
    }
    .xmas-close:hover { color: #fff; }

    .xmas-emoji {
        font-size: 3.4rem;
        line-height: 1;
        display: inline-block;
        animation: xmasSway 2.4s ease-in-out infinite;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.4));
    }
    @keyframes xmasSway {
        0%, 100% { transform: rotate(-6deg); }
        50% { transform: rotate(6deg); }
    }

    .xmas-badge {
        display: inline-block;
        margin-top: 16px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #60a5fa;
        background: rgba(96, 165, 250, 0.1);
        border: 1px solid rgba(96, 165, 250, 0.32);
        padding: 5px 14px;
        border-radius: 999px;
    }

    .xmas-card h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 2rem;
        margin: 14px 0 6px;
        background: linear-gradient(90deg, #60a5fa, #22d3ee, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .xmas-card p {
        color: rgba(255, 255, 255, 0.65);
        font-size: 0.95rem;
        line-height: 1.65;
        margin: 0 auto 8px;
        max-width: 320px;
    }
    .xmas-body p {
        margin-bottom: 10px;
    }
    /* Texto normal (sin bold), gris claro — como pidió el equipo */
    .xmas-body p:last-child {
        color: rgba(255, 255, 255, 0.68);
        font-weight: 400;
        margin-top: 6px;
    }

    .xmas-btn {
        margin-top: 22px;
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(90deg, #2563eb, #06b6d4);
        color: #fff;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .xmas-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.45);
    }

    .xmas-card > *:not(.xmas-snow):not(.xmas-close) {
        position: relative;
        z-index: 2;
    }
    .xmas-close { z-index: 3; }

    /* Nieve acumulada en las esquinas inferiores */
    .xmas-card::before,
    .xmas-card::after {
        content: '';
        position: absolute;
        bottom: 0;
        width: 140px;
        height: 54px;
        z-index: 1;
        pointer-events: none;
        opacity: 0.5;
        filter: blur(1.5px);
    }
    .xmas-card::before {
        left: 0;
        background:
            radial-gradient(ellipse 52px 34px at 4% 104%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 72%),
            radial-gradient(ellipse 44px 24px at 42% 112%, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 70%),
            radial-gradient(ellipse 38px 18px at 82% 116%, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 70%);
    }
    .xmas-card::after {
        right: 0;
        background:
            radial-gradient(ellipse 52px 34px at 96% 104%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 72%),
            radial-gradient(ellipse 44px 24px at 58% 112%, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 70%),
            radial-gradient(ellipse 38px 18px at 18% 116%, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 70%);
    }

    .xmas-snow,
    .xmas-snowbg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
    }
    .xmas-snow { border-radius: 24px; z-index: 0; }
    .xmas-snowbg { z-index: 0; }

    .xmas-snow span,
    .xmas-snowbg span {
        position: absolute;
        top: -14px;
        color: #fff;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        will-change: transform, opacity;
    }

    /* Nevada dentro del modal */
    .xmas-snow span {
        animation-name: xmasFallCard;
    }
    @keyframes xmasFallCard {
        0% { transform: translate3d(0, -20px, 0) rotate(0deg); opacity: 0; }
        10% { opacity: var(--o, 0.75); }
        50% { transform: translate3d(var(--dx, 14px), 55%, 0) rotate(200deg); }
        90% { opacity: var(--o, 0.75); }
        100% { transform: translate3d(calc(var(--dx, 14px) * -1), 115%, 0) rotate(400deg); opacity: 0; }
    }

    /* Nevada en pantalla completa (detrás del modal) */
    .xmas-snowbg span {
        animation-name: xmasFallBg;
        opacity: 0.35;
    }
    @keyframes xmasFallBg {
        0% { transform: translate3d(0, -6vh, 0) rotate(0deg); opacity: 0; }
        8% { opacity: var(--o, 0.45); }
        50% { transform: translate3d(var(--dx, 24px), 55vh, 0) rotate(180deg); }
        92% { opacity: var(--o, 0.45); }
        100% { transform: translate3d(calc(var(--dx, 24px) * -1), 112vh, 0) rotate(360deg); opacity: 0; }
    }
</style>

<script>
    (function () {
        const overlay = document.getElementById('verify-popup');
        if (!overlay) return;

        function close() {
            overlay.classList.remove('is-active');
        }
        window.closeVerifyPopup = close;

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') close();
        });

        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) close();
        });

        // Fijo: se muestra en cada visita mientras la alerta "Verificacion" esté activa
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(() => overlay.classList.add('is-active'), 400);
        });
        if (document.readyState !== 'loading') {
            setTimeout(() => overlay.classList.add('is-active'), 400);
        }
    })();
</script>
